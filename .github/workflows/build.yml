name: Build and Release Plugin

# Builds Lidarr.Plugin.Bandcamp and publishes Lidarr.Plugin.Bandcamp.net8.0.zip
# as a GitHub *Release* asset for System → Plugins.
#
# IMPORTANT:
# - Lidarr installs from GitHub **Releases**, not from Actions artifact downloads.
# - `actions/upload-artifact` always wraps downloads in an outer zip. Uploading a
#   .zip as the artifact therefore produces zip-of-zip ("unsupported" in Lidarr).
#   We upload the flat plugin *files* as the CI artifact instead.
# - Push a `v*` tag (or use workflow_dispatch with version) to create/update the Release.
#
# Requires this workflow on the *GitHub* remote (Origin → GitHub mirror).
# See docs/github-mirror.md.

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'If set (e.g. 0.2.1), create/update GitHub Release v{version} with the flat plugin zip'
        required: false
        type: string
        default: ''
  release:
    types: [published]

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.Bandcamp
  DOTNET_VERSION: '8.0.x'
  # Pin Lidarr AssemblyVersion major away from 10.x so PluginLoadContext binding works.
  LIDARR_ASSEMBLY_VERSION: 2.0.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Clone Lidarr source
        run: |
          git clone --depth 1 --branch plugins https://github.com/Lidarr/Lidarr.git ext/Lidarr

      - name: Pin Lidarr assembly versions
        run: |
          sed -i'' -e "s/<AssemblyVersion>10\.0\.0\.\*<\/AssemblyVersion>/<AssemblyVersion>${{ env.LIDARR_ASSEMBLY_VERSION }}<\/AssemblyVersion>/g" ext/Lidarr/src/Directory.Build.props
          echo "Pinned Lidarr AssemblyVersion to ${{ env.LIDARR_ASSEMBLY_VERSION }}"
          grep AssemblyVersion ext/Lidarr/src/Directory.Build.props

      - name: Resolve package version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=1
            TAG="$GITHUB_REF_NAME"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            PUBLISH=1
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
            PUBLISH=1
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            PUBLISH=0
            TAG=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} publish=${PUBLISH} tag=${TAG}"

      - name: Restore dependencies
        run: dotnet restore Lidarr.Plugin.Bandcamp.slnx -p:TreatWarningsAsErrors=false

      - name: Build
        run: |
          dotnet build Lidarr.Plugin.Bandcamp.slnx -c Release --no-restore \
            -p:TreatWarningsAsErrors=false \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Run tests
        run: |
          dotnet test Lidarr.Plugin.Bandcamp.slnx --no-build -c Release \
            --filter "FullyQualifiedName~Bandcamp" \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Package flat plugin zip
        id: pkg
        run: |
          set -euo pipefail
          # Lidarr extracts Release zip into plugins/<owner>/<repo>/ and only loads
          # Lidarr.Plugin.*.dll from that folder root (non-recursive).
          OUT="src/Lidarr.Plugin.Bandcamp/bin/Release/net8.0"
          STAGE="${{ github.workspace }}/artifacts/plugin"
          ZIP="${{ github.workspace }}/${{ env.PLUGIN_NAME }}.net8.0.zip"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for f in "${{ env.PLUGIN_NAME }}.dll" "${{ env.PLUGIN_NAME }}.deps.json" "${{ env.PLUGIN_NAME }}.pdb"; do
            test -f "$OUT/$f" || { echo "ERROR: missing $OUT/$f"; exit 1; }
            cp -f "$OUT/$f" "$STAGE/"
          done
          rm -f "$ZIP"
          (cd "$STAGE" && zip -9 -r "$ZIP" .)
          echo "Created $ZIP"
          unzip -l "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx "${{ env.PLUGIN_NAME }}.dll"
          unzip -Z1 "$ZIP" | grep -qx "${{ env.PLUGIN_NAME }}.deps.json"
          if unzip -Z1 "$ZIP" | grep -E '/'; then
            echo "ERROR: zip contains nested paths — Lidarr will not load the DLL" >&2
            exit 1
          fi
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      # Upload LOOSE files (not the .zip). Actions always wraps artifact downloads in an
      # outer zip — if we uploaded the .zip, users get zip-of-zip and Lidarr rejects it.
      - name: Upload CI artifact (flat plugin files)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-files
          path: |
            artifacts/plugin/${{ env.PLUGIN_NAME }}.dll
            artifacts/plugin/${{ env.PLUGIN_NAME }}.deps.json
            artifacts/plugin/${{ env.PLUGIN_NAME }}.pdb
          if-no-files-found: error

      - name: Job summary
        run: |
          {
            echo "## Lidarr Bandcamp plugin package"
            echo ""
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Flat Release zip (for Lidarr GitHub install): \`${{ env.PLUGIN_NAME }}.net8.0.zip\`"
            echo "- CI artifact \`${{ env.PLUGIN_NAME }}-files\`: dll + deps.json + pdb (NOT a zip-of-zip)"
            echo ""
            echo "### Lidarr install"
            echo "Use the **GitHub Release** asset after a \`v*\` tag (or workflow_dispatch with version)."
            echo "Do **not** feed an Actions/Origin CI download zip to Lidarr as the plugin package."
            echo ""
            echo '```'
            unzip -l "${{ env.PLUGIN_NAME }}.net8.0.zip"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release (flat net8.0.zip)
        if: steps.ver.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          ZIP: ${{ env.PLUGIN_NAME }}.net8.0.zip
        run: |
          set -euo pipefail
          test -f "$ZIP"
          test -n "$TAG"

          # workflow_dispatch may need to create the tag on this repo
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Lidarr Bandcamp Library plugin ${TAG}"
              git push origin "refs/tags/${TAG}"
            fi
          fi

          NOTES="$(mktemp)"
          {
            echo "## ${TAG}"
            echo ""
            echo "Flat Lidarr plugin package (\`${ZIP}\`):"
            echo "- \`${{ env.PLUGIN_NAME }}.dll\`"
            echo "- \`${{ env.PLUGIN_NAME }}.deps.json\`"
            echo "- \`${{ env.PLUGIN_NAME }}.pdb\`"
            echo ""
            echo "Install in Lidarr: **System → Plugins** → \`https://github.com/${{ github.repository }}\`"
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG}…"
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file "$NOTES" || true
          else
            echo "Creating release ${TAG}…"
            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --latest
          fi

          echo "Release assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
          # Must include the exact Lidarr filter suffix
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -F 'net8.0.zip' \
            || { echo "ERROR: Release missing *net8.0.zip asset"; exit 1; }
