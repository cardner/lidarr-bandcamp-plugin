name: Build and Release Plugin

# Builds Lidarr.Plugin.Bandcamp and, on v* tags, publishes a GitHub Release
# with Lidarr.Plugin.Bandcamp.net8.0.zip for Lidarr System → Plugins.
#
# Requires this workflow on the *GitHub* remote (Origin → GitHub mirror).
# See docs/github-mirror.md.

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  # Re-run publish when a Release is created manually for an existing tag
  release:
    types: [published]

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.Bandcamp
  # SDK used to compile the net8.0 plugin (newer SDK is fine)
  DOTNET_VERSION: '8.0.x'
  # AssemblyVersion pinned to a LOW major version for cross-version compatibility.
  # Lidarr uses non-deterministic 10.0.0.* which changes every build. .NET's assembly
  # binding requires an EXACT version match when the major version component is the same
  # (10.x.x vs 10.x.x). By pinning to a different major version (2.0.0.0), .NET's
  # PluginLoadContext falls through to the default AssemblyLoadContext which resolves
  # Lidarr.Core by simple name regardless of version. This is the same approach used by
  # Tubifarry (2.1.0.0), Deezer (3.0.0.4855), and other working Lidarr plugins.
  LIDARR_ASSEMBLY_VERSION: 2.0.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Clone Lidarr source
        run: |
          git clone --depth 1 --branch plugins https://github.com/Lidarr/Lidarr.git ext/Lidarr

      - name: Pin Lidarr assembly versions
        run: |
          # Pin Lidarr's non-deterministic AssemblyVersion (10.0.0.*) to a version with a
          # DIFFERENT major component. .NET's PluginLoadContext falls through to the default
          # ALC when it can't resolve the assembly. The default ALC has Lidarr.Core loaded at
          # 10.0.0.XXXX. When our plugin references 2.0.0.0, .NET resolves by simple name
          # (Lidarr.Core) without strict version matching because the major versions differ.
          sed -i'' -e "s/<AssemblyVersion>10\.0\.0\.\*<\/AssemblyVersion>/<AssemblyVersion>${{ env.LIDARR_ASSEMBLY_VERSION }}<\/AssemblyVersion>/g" ext/Lidarr/src/Directory.Build.props
          echo "Pinned Lidarr AssemblyVersion to ${{ env.LIDARR_ASSEMBLY_VERSION }}"
          grep AssemblyVersion ext/Lidarr/src/Directory.Build.props

      - name: Resolve package version
        id: ver
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependencies
        run: dotnet restore Lidarr.Plugin.Bandcamp.slnx -p:TreatWarningsAsErrors=false

      - name: Build
        run: |
          dotnet build Lidarr.Plugin.Bandcamp.slnx -c Release --no-restore \
            -p:TreatWarningsAsErrors=false \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Run tests
        run: |
          dotnet test Lidarr.Plugin.Bandcamp.slnx --no-build -c Release \
            --filter "FullyQualifiedName~Bandcamp" \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Package flat plugin zip
        run: |
          # Lidarr extracts the zip into plugins/<owner>/<repo>/ and only loads
          # Lidarr.Plugin.*.dll from that folder root (non-recursive). Entries MUST
          # be flat: dll + deps.json (+ pdb). Never nest src/... paths or a zip-in-zip.
          OUT="src/Lidarr.Plugin.Bandcamp/bin/Release/net8.0"
          STAGE="${{ github.workspace }}/artifacts/plugin"
          ZIP="${{ github.workspace }}/${{ env.PLUGIN_NAME }}.net8.0.zip"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for f in "${{ env.PLUGIN_NAME }}.dll" "${{ env.PLUGIN_NAME }}.deps.json" "${{ env.PLUGIN_NAME }}.pdb"; do
            test -f "$OUT/$f" || { echo "ERROR: missing $OUT/$f"; exit 1; }
            cp -f "$OUT/$f" "$STAGE/"
          done
          rm -f "$ZIP"
          (cd "$STAGE" && zip -9 -r "$ZIP" .)
          echo "Created $ZIP"
          unzip -l "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx "${{ env.PLUGIN_NAME }}.dll"
          unzip -Z1 "$ZIP" | grep -qx "${{ env.PLUGIN_NAME }}.deps.json"
          # Fail if anything is nested (would break Lidarr discovery)
          if unzip -Z1 "$ZIP" | grep -E '/'; then
            echo "ERROR: zip contains nested paths — Lidarr will not load the DLL" >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          # Single flat zip only — uploading the DLL with its src/... path alongside
          # caused users to re-upload a nested Actions artifact as the Release asset.
          name: ${{ env.PLUGIN_NAME }}.net8.0
          path: ${{ env.PLUGIN_NAME }}.net8.0.zip

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: |
          echo "## Changelog" > changelog.txt
          git log --oneline "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")"..HEAD | \
            awk '{print "- " substr($0, index($0,$2))}' >> changelog.txt || true
          cat changelog.txt

      # Creates the Release on tag push, or uploads/updates assets when a Release
      # already exists for that tag (softprops updates in place).
      - name: Publish GitHub Release zip
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          body_path: changelog.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ env.PLUGIN_NAME }}.net8.0.zip
